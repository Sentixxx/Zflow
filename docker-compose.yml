services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zflow
      POSTGRES_USER: zflow
      POSTGRES_PASSWORD: zflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8080"
    environment:
      ZFLOW_POSTGRES_DSN: postgres://zflow:zflow@postgres:5432/zflow?sslmode=disable
      ZFLOW_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/feeds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
